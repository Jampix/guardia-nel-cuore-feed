name: Test

# Esegue i test unitari su push a main e su ogni Pull Request che tocca il
# codice interessato. Nessuna credenziale né risorsa AWS necessaria: il backend
# simula l'SDK (aws-sdk-client-mock), il frontend gira in Chrome headless.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: backend
        run: npm ci
      - name: Test
        working-directory: backend
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      # Karma serve un browser vero: e' quello che permette di verificare anche
      # l'impaginazione (in jsdom non esiste layout). Chrome e' preinstallato sui
      # runner ubuntu; il percorso va indicato a karma-chrome-launcher.
      - name: Test (client + admin)
        working-directory: frontend
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run test:ci
