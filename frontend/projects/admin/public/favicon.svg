<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Guardia nel Cuore">
  <!-- Stessa forma dell'icona Material `favorite` usata come marchio nell'app,
       e stessi colori del tema: #b02d21 e' il primary in chiaro, #ffb4a9 in
       scuro (una tinta scura si perderebbe su una tab scura).
       NB: nei commenti XML il doppio trattino e' vietato, quindi qui non si
       possono citare i nomi delle variabili CSS del tema. -->
  <style>
    .heart { fill: #b02d21; }
    @media (prefers-color-scheme: dark) {
      .heart { fill: #ffb4a9; }
    }
  </style>
  <path class="heart" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
</svg>
